openapi: 3.0.3
info:
  title: Web Service Backend API
  version: 1.0.0
  description: |
    OpenAPI specification for the Express backend.
    All endpoints are prefixed with `/api`
  contact:
    name: API Support
  license:
    name: MIT
servers:
  - url: https://backend-yp5g.onrender.com
    description: Production server
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User profile and preferences management
  - name: Map
    description: Map data endpoints (traffic, weather areas)
  - name: Business
    description: Business account features (policies, dashboard)
  - name: Admin
    description: Admin management endpoints (areas, scenarios, alerts)
  - name: Routes
    description: Route management (locations, favorites, history)
  - name: Response Scenarios
    description: Response scenario management
  - name: Weather
    description: Weather data proxy endpoints

paths:
  # ======================== AUTH ROUTES ========================
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Sign up new user
      description: Register a new user account (individual or business)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created successfully
        '400':
          description: Validation error (duplicate email, invalid password, etc.)

  /api/auth/signin:
    post:
      tags: [Auth]
      summary: Sign in user
      description: Authenticate user with email/username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                    nullable: true
                  email:
                    type: string
                    format: email
                  roles:
                    type: array
                    items:
                      type: string
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Invalid credentials

  /api/auth/google:
    post:
      tags: [Auth]
      summary: Google OAuth login
      description: Authenticate with Google OAuth token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
                  description: Google ID token
                credential:
                  type: string
                  description: Google credential
                code:
                  type: string
                  description: Google authorization code
              description: Provide one of idToken, credential, or code
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                    nullable: true
                  email:
                    type: string
                    format: email
                  roles:
                    type: array
                    items:
                      type: string
                  isNewUser:
                    type: boolean
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '400':
          description: Invalid token or code

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Invalidate the current session (require authentication)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized

  /api/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Get a new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Invalid refresh token

  /api/auth/send-otp:
    post:
      tags: [Auth]
      summary: Send OTP to email
      description: Send One-Time Password to user's email for password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        '200':
          description: OTP sent successfully
        '404':
          description: User not found

  /api/auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP
      description: Verify OTP code sent to user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  description: OTP code from email
              required: [email, code]
      responses:
        '200':
          description: OTP verified successfully
        '400':
          description: Invalid or expired OTP

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password by email
      description: Reset password using email and new password (requires prior OTP verification)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                newPassword:
                  type: string
              required: [email, newPassword]
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid request

  # ======================== USER ROUTES ========================
  /api/users/test/all:
    get:
      tags: [Users]
      summary: Public test endpoint
      description: Test endpoint without authentication
      responses:
        '200':
          description: Success

  /api/users/test/user:
    get:
      tags: [Users]
      summary: Authenticated user test endpoint
      description: Test endpoint that requires authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized

  /api/users/test/mod:
    get:
      tags: [Users]
      summary: Moderator test endpoint
      description: Test endpoint that requires moderator role
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
        '403':
          description: Forbidden - insufficient permissions

  /api/users/test/admin:
    get:
      tags: [Users]
      summary: Admin test endpoint
      description: Test endpoint that requires admin role
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
        '403':
          description: Forbidden - insufficient permissions

  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      description: Retrieve authenticated user's profile information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
    put:
      tags: [Users]
      summary: Update current user profile
      description: Update authenticated user's profile information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                fullName:
                  type: string
                companyName:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Profile updated successfully
        '401':
          description: Unauthorized

  /api/users/me/preferences:
    get:
      tags: [Users]
      summary: Get user preferences
      description: Retrieve user's preferences and settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferences returned
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
    put:
      tags: [Users]
      summary: Update user preferences
      description: Update user's preferences and settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Preferences updated successfully
        '401':
          description: Unauthorized

  /api/users/notifications:
    get:
      tags: [Users]
      summary: Get user notifications
      description: Retrieve all notifications for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          description: Unauthorized

  /api/users/notification:
    get:
      tags: [Users]
      summary: Get notifications (alias endpoint)
      description: Alternative endpoint to get notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications returned
        '401':
          description: Unauthorized

  /api/users/notifications/{id}/read:
    put:
      tags: [Users]
      summary: Mark notification as read
      description: Mark a specific notification as read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Notification ID
      responses:
        '200':
          description: Notification marked as read
        '401':
          description: Unauthorized
        '404':
          description: Notification not found

  /api/users/me/report-schedules:
    get:
      tags: [Users]
      summary: Get report schedules
      description: Retrieve all report schedules for the user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Report schedules returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          description: Unauthorized
    post:
      tags: [Users]
      summary: Save report schedule
      description: Create or update a report schedule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                frequency:
                  type: string
                  enum: [daily, weekly, monthly]
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Report schedule created
        '200':
          description: Report schedule updated
        '401':
          description: Unauthorized

  /api/users/me/report-history:
    get:
      tags: [Users]
      summary: Get report history
      description: Retrieve report export/download history for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Report history returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportHistoryList'
        '401':
          description: Unauthorized
    post:
      tags: [Users]
      summary: Create report history
      description: Create a new report history record for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportHistoryCreate'
      responses:
        '201':
          description: Report history created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportHistory'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  # ======================== MAP ROUTES ========================
  /api/map/traffic:
    get:
      tags: [Map]
      summary: Get traffic data
      description: Retrieve current traffic information
      responses:
        '200':
          description: Traffic data returned
          content:
            application/json:
              schema:
                type: object

  /api/map/weather-areas:
    get:
      tags: [Map]
      summary: Get weather areas
      description: Retrieve weather monitoring areas
      responses:
        '200':
          description: Weather areas returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  # ======================== BUSINESS ROUTES ========================
  /api/business/policies:
    get:
      tags: [Business]
      summary: Get alert policies
      description: Retrieve all alert policies for the business account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Policies returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertPolicy'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - not a business account
    post:
      tags: [Business]
      summary: Create alert policy
      description: Create a new alert policy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                triggers:
                  type: array
                  items:
                    type: string
                actions:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Policy created successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - not a business account

  # ======================== ADMIN ROUTES ========================
  /api/admin/areas:
    get:
      tags: [Admin]
      summary: List areas
      description: Retrieve all administrative areas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Areas returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
    post:
      tags: [Admin]
      summary: Create area
      description: Create a new administrative area
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                coordinates:
                  type: object
      responses:
        '201':
          description: Area created successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required

  /api/admin/areas/{id}:
    get:
      tags: [Admin]
      summary: Get area by id
      description: Retrieve a specific administrative area
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Area returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
        '404':
          description: Area not found
    put:
      tags: [Admin]
      summary: Update area
      description: Update an administrative area
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                coordinates:
                  type: object
      responses:
        '200':
          description: Area updated successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
        '404':
          description: Area not found
    delete:
      tags: [Admin]
      summary: Delete area
      description: Delete an administrative area
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Area deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
        '404':
          description: Area not found

  /api/admin/areas/{id}/thresholds:
    get:
      tags: [Admin]
      summary: Get area thresholds
      description: Retrieve temperature and rain thresholds for an administrative area
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Area thresholds returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaThresholds'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
        '404':
          description: Area not found
    put:
      tags: [Admin]
      summary: Update area thresholds
      description: Update temperature and rain thresholds for an administrative area
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                temp_threshold:
                  type: integer
                  nullable: true
                  description: Temperature threshold in degrees (Celsius)
                rain_threshold:
                  type: integer
                  nullable: true
                  description: Rain threshold in millimeters
      responses:
        '200':
          description: Area thresholds updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaThresholds'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
        '404':
          description: Area not found

  /api/admin/scenarios:
    get:
      tags: [Admin]
      summary: List response scenarios
      description: Retrieve all response scenarios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scenarios returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseScenario'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
    post:
      tags: [Admin]
      summary: Create response scenario
      description: Create a new response scenario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                steps:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Scenario created successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required

  /api/admin/scenarios/{id}:
    get:
      tags: [Admin]
      summary: Get scenario by id
      description: Retrieve a specific response scenario
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Scenario returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseScenario'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
        '404':
          description: Scenario not found

  /api/admin/scenarios/{id}/items:
    post:
      tags: [Admin]
      summary: Add checklist item to scenario
      description: Add a checklist item to a response scenario
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Checklist item added successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
        '404':
          description: Scenario not found

  /api/admin/dashboard:
    get:
      tags: [Admin]
      summary: Get admin dashboard
      description: Retrieve admin dashboard with system statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data returned
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required

  /api/admin/alerts:
    get:
      tags: [Admin]
      summary: List alert events
      description: Retrieve all alert events
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alerts returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertEvent'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
    post:
      tags: [Admin]
      summary: Create alert event
      description: Create a new alert event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                areaId:
                  type: integer
      responses:
        '201':
          description: Alert created successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required

  /api/admin/alerts/{id}:
    get:
      tags: [Admin]
      summary: Get alert event by id
      description: Retrieve a specific alert event
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Alert returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertEvent'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
        '404':
          description: Alert not found
    put:
      tags: [Admin]
      summary: Update alert event
      description: Update an alert event
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                status:
                  type: string
                  enum: [active, resolved, cancelled]
      responses:
        '200':
          description: Alert updated successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
        '404':
          description: Alert not found
    delete:
      tags: [Admin]
      summary: Delete alert event
      description: Delete an alert event
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Alert deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - admin role required
        '404':
          description: Alert not found

  # ======================== ROUTES MANAGEMENT ========================
  /api/routes/locations:
    get:
      tags: [Routes]
      summary: List locations
      description: Retrieve all saved locations for the user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Locations returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '401':
          description: Unauthorized
    post:
      tags: [Routes]
      summary: Create location
      description: Create a new location
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
              required: [name, latitude, longitude]
      responses:
        '201':
          description: Location created successfully
        '401':
          description: Unauthorized

  /api/routes/locations/{id}:
    put:
      tags: [Routes]
      summary: Update location
      description: Update an existing location
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        '200':
          description: Location updated successfully
        '401':
          description: Unauthorized
        '404':
          description: Location not found
    delete:
      tags: [Routes]
      summary: Delete location
      description: Delete a location
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Location deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Location not found

  /api/routes:
    get:
      tags: [Routes]
      summary: List routes
      description: Retrieve all routes for the user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Routes returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
        '401':
          description: Unauthorized
    post:
      tags: [Routes]
      summary: Create route
      description: Create a new route
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                originId:
                  type: integer
                destinationId:
                  type: integer
                distance:
                  type: number
