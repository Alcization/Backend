  /api/weather/data/history/city:
    post:
      tags: [Weather]
      summary: Get city weather history
      description: Retrieve historical weather data for a city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: City name
                start:
                  type: string
                  format: date-time
                  description: Start date for historical data
                end:
                  type: string
                  format: date-time
                  description: End date for historical data
              required: [q]
      responses:
        '200':
          description: Historical weather data returned
        '400':
          description: Invalid request

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID

  schemas:
    # ======================== AUTH SCHEMAS ========================
    SignupRequest:
      type: object
      properties:
        username:
          type: string
          description: Unique username
        email:
          type: string
          format: email
          description: User email
        password:
          type: string
          description: User password (minimum 6 characters)
        accountType:
          type: string
          enum: [individual, business]
          description: Type of account
        fullName:
          type: string
          description: User's full name
        companyName:
          type: string
          description: Company name (required for business accounts)
        taxCode:
          type: string
          description: Tax code (for business accounts)
        roles:
          type: array
          items:
            type: string
          description: User roles
      required: [email, password]

    SigninRequest:
      type: object
      properties:
        emailOrUsername:
          type: string
          description: Email or username for login
        password:
          type: string
          description: User password
      required: [emailOrUsername, password]

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token obtained from login
      required: [refreshToken]

    # ======================== USER SCHEMAS ========================
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
          nullable: true
        email:
          type: string
          format: email
        fullName:
          type: string
        accountType:
          type: string
          enum: [individual, business]
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ======================== ROUTE/LOCATION SCHEMAS ========================
    Location:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        createdAt:
          type: string
          format: date-time

    Route:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        originId:
          type: integer
        destinationId:
          type: integer
        distance:
          type: number
          description: Distance in kilometers
        estimatedTime:
          type: integer
          description: Estimated time in minutes
        isFavorite:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ======================== ADMIN SCHEMAS ========================
    Area:
      type: object
      properties:
        area_id:
          type: integer
          description: Unique area identifier
        officer_id:
          type: integer
          nullable: true
          description: ID of the administrative officer managing this area
        name:
          type: string
          description: Area name
        area_type:
          type: string
          description: Area type (Phường or Quận)
        address:
          type: string
          description: Text address of the area
        management_area:
          type: object
          description: Circle geometry with center coordinates and radius
          properties:
            center:
              type: object
              properties:
                lat:
                  type: number
                  description: Latitude
                lng:
                  type: number
                  description: Longitude
            radius_km:
              type: number
              description: Radius in kilometers
        temp_threshold:
          type: integer
          nullable: true
          description: Temperature threshold in degrees Celsius
        rain_threshold:
          type: integer
          nullable: true
          description: Rain threshold in millimeters
        AdministrativeOfficer:
          type: object
          nullable: true
          description: Associated administrative officer details

    AreaThresholds:
      type: object
      properties:
        area_id:
          type: integer
          description: Area identifier
        name:
          type: string
          description: Area name
        temp_threshold:
          type: integer
          nullable: true
          description: Temperature threshold in degrees Celsius
        rain_threshold:
          type: integer
          nullable: true
          description: Rain threshold in millimeters

    ResponseScenario:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            type: string
        checklistItems:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time

    AlertEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [active, resolved, cancelled]
        areaId:
          type: integer
        createdAt:
          type: string
          format: date-time

    AlertPolicy:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        name:
          type: string
        description:
          type: string
        triggers:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    ReportHistory:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        link:
          type: string

    ReportHistoryCreate:
      type: object
      properties:
        name:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
          description: Datetime of report generation; if omitted, server will use current time
        link:
          type: string
      required: [link]

    ReportHistoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportHistory'
