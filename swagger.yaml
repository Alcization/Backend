  # ======================== WEATHER/OPENWEATHER ROUTES ========================
  /api/weather/geo:
    post:
      tags: [Weather]
      summary: Get direct geocoding
      description: Converts city name or address into geographic coordinates (latitude, longitude)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: City name or address to geocode
                limit:
                  type: integer
                  description: Number of results to return (default 1)
              required: [q]
      responses:
        '200':
          description: Geocoding results returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    lat:
                      type: number
                    lon:
                      type: number
                    country:
                      type: string
        '400':
          description: Invalid request

  /api/weather/data/weather:
    post:
      tags: [Weather]
      summary: Get current weather
      description: Retrieve current weather data for a specific location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                  description: Latitude
                lon:
                  type: number
                  description: Longitude
              required: [lat, lon]
      responses:
        '200':
          description: Current weather data returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  temp:
                    type: number
                  feels_like:
                    type: number
                  humidity:
                    type: integer
                  pressure:
                    type: integer
                  weather:
                    type: array
                    items:
                      type: object
                  wind_speed:
                    type: number
        '400':
          description: Invalid coordinates

