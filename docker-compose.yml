services:
  db:
    image: postgres:16-alpine
    container_name: web-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: weather_traffic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weather_traffic"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-service-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: weather_traffic
      DB_USER: postgres
      DB_PASS: admin
      DB_DIALECT: postgres

volumes:
  postgres_data: